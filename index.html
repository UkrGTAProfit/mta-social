<div id="messages" class="page">

    <div class="card">

        <h1>💬 Повідомлення</h1>

        <p class="muted">
            Обери друга, щоб почати спілкування.
        </p>

        <div id="chatFriends">
            <div class="empty">
                Завантаження друзів...
            </div>
        </div>

    </div>

    <div
        id="chatWindow"
        class="card"
        style="display:none"
    >

        <h2 id="chatTitle">
            💬 Чат
        </h2>

        <div
            id="chatMessages"
            style="
            height:350px;
            overflow-y:auto;
            background:#080b12;
            border-radius:12px;
            padding:15px;
            "
        ></div>

        <div
            style="
            display:flex;
            gap:10px;
            margin-top:12px;
            "
        >

            <input
                id="messageInput"
                placeholder="Напиши повідомлення..."
                style="margin:0"
            >

            <button
                onclick="sendMessage()"
                style="
                width:auto;
                margin:0;
                padding:12px 18px;
                "
            >
                📤
            </button>

        </div>

    </div>

</div>
