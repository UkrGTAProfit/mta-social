<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTA Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#080b12;
color:#fff;
font-family:Arial,sans-serif
}

.auth{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px
}

.box{
width:380px;
max-width:100%;
background:#101620;
border:1px solid #202838;
border-radius:20px;
padding:30px
}

.logo{
color:#4da3ff;
font-size:27px;
font-weight:800
}

h1{margin-bottom:8px}

.muted{color:#8994a7}

input{
width:100%;
padding:14px;
margin-top:12px;
background:#080b12;
border:1px solid #303b50;
border-radius:10px;
color:white;
font-size:16px
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:0;
border-radius:10px;
background:#4da3ff;
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer
}

.secondary{background:#182130}

#message{
margin-top:15px;
color:#4da3ff
}

#app{display:none}

header{
height:70px;
background:#0d111a;
border-bottom:1px solid #202838;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px
}

header button{
width:auto;
margin:0;
padding:10px 18px
}

.container{
max-width:900px;
margin:30px auto;
padding:20px
}

.card{
background:#101620;
border:1px solid #202838;
border-radius:18px;
padding:25px;
margin-bottom:20px
}

.avatar{
width:70px;
height:70px;
background:#4da3ff;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:bold
}
</style>
</head>

<body>

<div id="auth" class="auth">

<div class="box">

<div class="logo">MTA SOCIAL</div>

<h1>Ласкаво просимо 👋</h1>

<p class="muted">
Створи акаунт або увійди.
</p>

<input
id="email"
type="email"
placeholder="Email"
>

<input
id="password"
type="password"
placeholder="Пароль"
>

<button onclick="register()">
Створити акаунт
</button>

<button
class="secondary"
onclick="login()"
>
Увійти
</button>

<p id="message"></p>

</div>

</div>


<div id="app">

<header>

<div class="logo">
MTA SOCIAL
</div>

<button
class="secondary"
onclick="logout()"
>
Вийти
</button>

</header>


<div class="container">

<div class="card">

<div class="avatar" id="avatar">
M
</div>

<h2 id="userEmail">
Користувач
</h2>

<p class="muted">
Твій профіль MTA Social
</p>

</div>


<div class="card">

<h2>🏠 Головна</h2>

<p class="muted">
Тут буде твоя стрічка постів.
</p>

</div>


<div class="card">

<h2>🎮 MTA</h2>

<p class="muted">
Профіль гравця, статистика,
сервери та досягнення.
</p>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://ifsqesikynpsdgucaljc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_B3EZXy-9dWui5rDwEHEZhQ_HqfMIP4p";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


async function register(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const message =
document.getElementById("message");

if(!email || !password){

message.textContent =
"Введи email і пароль.";

return;
}

if(password.length < 6){

message.textContent =
"Пароль має бути мінімум 6 символів.";

return;
}

message.textContent =
"Створюємо акаунт...";

const {data,error} =
await supabaseClient.auth.signUp({
email:email,
password:password
});

if(error){

message.textContent =
"Помилка: " + error.message;

return;
}

message.textContent =
"✅ Акаунт створено! Перевір email для підтвердження.";
}


async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const message =
document.getElementById("message");

if(!email || !password){

message.textContent =
"Введи email і пароль.";

return;
}

message.textContent =
"Входимо...";

const {data,error} =
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){

message.textContent =
"Помилка: " + error.message;

return;
}

showApp(data.user);
}


function showApp(user){

document.getElementById("auth").style.display="none";

document.getElementById("app").style.display="block";

const email =
user.email || "Користувач";

document.getElementById("userEmail")
.textContent=email;

document.getElementById("avatar")
.textContent=email.charAt(0).toUpperCase();
}


async function logout(){

await supabaseClient.auth.signOut();

location.reload();
}


async function checkUser(){

const {data:{user}} =
await supabaseClient.auth.getUser();

if(user){

showApp(user);

}

}

checkUser();

</script>

</body>
</html>
